name: Build and release the desktop app

# Push a tag like desktop-v1.2.0 and this builds the .exe and publishes the
# release that the app's auto-updater looks at. Run it manually
# (Actions -> Build and release the desktop app -> Run workflow) to get a test
# build without publishing anything.
#
# Why this exists: the .exe was previously built on a laptop and dragged into
# the Releases page by hand, which lost an upload once (desktop-v1.1.1 shipped
# with no asset, so no installed copy could see it) and risks shipping a build
# made from a dirty working tree.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r desktop/requirements.txt

      # The updater compares the running __version__ against the release tag,
      # so a mismatch would ship a build that never sees itself as out of date.
      - name: Check the tag matches desktop/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          VER=$(python -c "import sys; sys.path.insert(0, 'desktop'); import version; print(version.__version__)")
          echo "tag=$TAG  version.py=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag desktop-v$TAG does not match desktop/version.py ($VER) - bump version.py first."
            exit 1
          fi

      - name: Build the exe
        run: pyinstaller --noconfirm --clean desktop/GlassesFiller.spec

      # Headless and exhaustive: builds every tab and checks the BaseTab
      # contract. Beats "launch it and see if it stays up".
      - name: Selftest the frozen exe
        run: .\dist\GlassesFiller.exe --selftest

      # Builds are attached to a PUBLIC release, so a credential baked into one
      # would be published to the world. This has to fail the build, not warn.
      - name: Check the binary carries no secrets
        shell: bash
        run: |
          fail=0
          for pattern in github_pat ghp_ "postgresql://" sk-ant Glasses-Filler-Data pooler.supabase; do
            if grep -qa "$pattern" dist/GlassesFiller.exe; then
              echo "::error::Found '$pattern' inside the built exe - refusing to publish."
              fail=1
            else
              echo "clean: $pattern"
            fi
          done
          exit $fail

      # Always produced, so a manual run still gives you something to download.
      - uses: actions/upload-artifact@v4
        with:
          name: GlassesFiller-exe
          path: dist/GlassesFiller.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTES=$(cat <<'EOF'
          **Download `GlassesFiller.exe` below and run it - nothing to install.**

          Already running an older version? It will offer the update itself on next launch.

          First run: Windows SmartScreen shows an "unknown publisher" warning (the exe is
          unsigned) - choose *More info* -> *Run anyway*.

          Colleagues need the snapshot repo and a read-only token pasted into
          Settings once; no database credentials.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing the asset"
            gh release upload "$TAG" dist/GlassesFiller.exe --clobber
          else
            gh release create "$TAG" dist/GlassesFiller.exe \
              --title "$TAG" --notes "$NOTES"
          fi
